<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="情報安全確保支援士（SC）過去問解説サイト">
  <title>情報安全確保支援士 過去問解説</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">SC KAKOMON</p>
      <h1>情報安全確保支援士<br>過去問解説</h1>
      <p class="lead">過去問を検索して、正解・解説・関連知識を確認できます。</p>
      <input id="search" class="search" type="search" placeholder="問題・分野・キーワードを検索">
    </div>
  </header>

  <main class="container">
    <section class="filters">
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="午前Ⅱ">午前Ⅱ</button>
      <button class="filter" data-filter="午後">午後</button>
    </section>

    <section>
      <div class="section-heading">
        <h2>問題一覧</h2>
        <span id="count"></span>
      </div>
      <div id="question-list" class="question-list"></div>
    </section>
  </main>

  <footer>
    <div class="container">情報安全確保支援士 過去問解説サイト</div>
  </footer>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
